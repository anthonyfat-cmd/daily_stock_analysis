name: Stock Data Validation - Phase 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-data-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      STOCK_LIST: AAPL,NVDA,GOOG
      DATABASE_PATH: ./data/stock_analysis.db
      WEBUI_ENABLED: 'false'
      SCHEDULE_ENABLED: 'false'
      ADMIN_AUTH_ENABLED: 'true'
      MARKET_REVIEW_REGION: us
    steps:
      - name: Checkout fork without persisted token
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project dependencies (isolated runner, no secrets)
        run: python -m pip install -r requirements.txt

      - name: App dry-run (data only, no AI, no notifications)
        continue-on-error: true
        run: python main.py --dry-run --stocks AAPL,NVDA,GOOG --no-notify --no-market-review --force-run

      - name: Export data and validate OHLCV, EMA, SMA and volume
        run: |
          python - <<'PYVALIDATION'
          """Read-only validation/export of daily_stock_analysis dry-run market data.
          Runs on an ephemeral GitHub-hosted runner; no API keys or brokerage access.
          """
          from __future__ import annotations
          
          import csv
          import os
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path
          
          import pandas as pd
          import yfinance as yf
          
          SYMBOLS = ("AAPL", "NVDA", "GOOG")
          OUTPUT = Path("validation-results")
          OUTPUT.mkdir(exist_ok=True)
          DB_PATH = Path(os.environ.get("DATABASE_PATH", "./data/stock_analysis.db"))
          
          APP_COLS = ("Ticker", "Date", "Open", "High", "Low", "Close", "Volume", "DataSource")
          EXT_COLS = ("Ticker", "Date", "Open", "High", "Low", "Close", "Volume",
                      "EMA9", "EMA21", "SMA50", "SMA200", "AvgVolume20", "VolumeRatio20",
                      "Prior20DayHigh", "AbovePrior20DayHigh")
          SUMMARY_COLS = ("Ticker", "AppRows", "AppLastDate", "AppSource", "YahooRows",
                          "YahooLastDate", "ComparedRows", "MeanCloseDifferencePct",
                          "MaxCloseDifferencePct", "InvalidAppBars", "InvalidYahooBars", "Result", "Notes")
          
          
          def write_rows(path: Path, headers: tuple[str, ...], rows: list[dict]):
              with path.open("w", newline="", encoding="utf-8") as f:
                  w = csv.DictWriter(f, fieldnames=headers, extrasaction="ignore")
                  w.writeheader()
                  w.writerows(rows)
          
          
          def bad_bar_count(frame: pd.DataFrame) -> int:
              if frame.empty:
                  return 0
              p = frame[["Open", "High", "Low", "Close", "Volume"]].apply(pd.to_numeric, errors="coerce")
              invalid = (p.isna().any(axis=1) | (p[["Open", "High", "Low", "Close"]] <= 0).any(axis=1)
                         | (p["Volume"] < 0)
                         | (p["High"] + 1e-7 < p[["Open", "Close", "Low"]].max(axis=1))
                         | (p["Low"] - 1e-7 > p[["Open", "Close", "High"]].min(axis=1)))
              return int(invalid.sum())
          
          
          def read_app_data() -> tuple[pd.DataFrame, str | None]:
              if not DB_PATH.is_file():
                  return pd.DataFrame(columns=APP_COLS), f"App database missing: {DB_PATH}"
              try:
                  # Open SQLite read-only so validation cannot modify the app's data.
                  with sqlite3.connect(f"file:{DB_PATH.resolve().as_posix()}?mode=ro", uri=True) as conn:
                      qmarks = ",".join("?" for _ in SYMBOLS)
                      rows = conn.execute(
                          "SELECT code, date, open, high, low, close, volume, data_source "
                          f"FROM stock_daily WHERE code IN ({qmarks}) ORDER BY code, date",
                          SYMBOLS,
                      ).fetchall()
              except sqlite3.Error as exc:
                  return pd.DataFrame(columns=APP_COLS), f"Unable to read stock_daily: {exc}"
              result = pd.DataFrame(rows, columns=APP_COLS)
              if not result.empty:
                  result["Date"] = pd.to_datetime(result["Date"], errors="coerce").dt.strftime("%Y-%m-%d")
              return result, None
          
          
          def download_extended(ticker: str) -> pd.DataFrame:
              # 2 years provides enough warm-up history to calculate SMA200.
              bars = yf.download(
                  ticker, period="2y", interval="1d", auto_adjust=True,
                  progress=False, threads=False, multi_level_index=False,
              )
              if bars is None or bars.empty:
                  raise ValueError("Yahoo Finance returned no rows")
              if isinstance(bars.columns, pd.MultiIndex):
                  if "Close" in bars.columns.get_level_values(0):
                      bars.columns = bars.columns.get_level_values(0)
                  else:
                      bars.columns = bars.columns.get_level_values(-1)
              bars = bars.reset_index()
              if "Date" not in bars.columns:
                  raise ValueError(f"Unexpected Yahoo columns: {list(bars.columns)}")
              bars["Date"] = pd.to_datetime(bars["Date"], errors="coerce").dt.strftime("%Y-%m-%d")
              needed = ["Date", "Open", "High", "Low", "Close", "Volume"]
              bars = bars[needed].dropna(subset=["Date"]).sort_values("Date").reset_index(drop=True)
              for col in needed[1:]:
                  bars[col] = pd.to_numeric(bars[col], errors="coerce")
              if bars["Date"].duplicated().any():
                  raise ValueError("Duplicate dates from Yahoo Finance")
              bars.insert(0, "Ticker", ticker)
              bars["EMA9"] = bars["Close"].ewm(span=9, adjust=False, min_periods=9).mean()
              bars["EMA21"] = bars["Close"].ewm(span=21, adjust=False, min_periods=21).mean()
              bars["SMA50"] = bars["Close"].rolling(50, min_periods=50).mean()
              bars["SMA200"] = bars["Close"].rolling(200, min_periods=200).mean()
              bars["AvgVolume20"] = bars["Volume"].rolling(20, min_periods=20).mean()
              bars["VolumeRatio20"] = bars["Volume"].div(bars["AvgVolume20"].replace(0, float("nan")))
              bars["Prior20DayHigh"] = bars["High"].shift(1).rolling(20, min_periods=20).max()
              bars["AbovePrior20DayHigh"] = bars["Close"] > bars["Prior20DayHigh"]
              return bars
          
          
          def days_old(iso_date: str) -> int:
              day = datetime.strptime(iso_date, "%Y-%m-%d").date()
              return (datetime.now(timezone.utc).date() - day).days
          
          
          def main() -> int:
              # Deterministic indicator smoke test, independent of market-data source.
              flat = pd.Series([10.0] * 220)
              assert abs(flat.ewm(span=9, adjust=False).mean().iloc[-1] - 10.0) < 1e-10
              assert abs(flat.rolling(200).mean().iloc[-1] - 10.0) < 1e-10
          
              app, db_error = read_app_data()
              write_rows(OUTPUT / "app_ohlcv.csv", APP_COLS, app.to_dict("records"))
          
              extended_parts: list[pd.DataFrame] = []
              report: list[dict] = []
              failed = False
              for ticker in SYMBOLS:
                  notes: list[str] = []
                  app_one = app.loc[app["Ticker"] == ticker].copy()
                  invalid_app = bad_bar_count(app_one)
                  app_source = ",".join(sorted(set(app_one["DataSource"].dropna().astype(str))))
                  app_last = str(app_one["Date"].max()) if len(app_one) else ""
                  if db_error:
                      notes.append(db_error)
                  if len(app_one) < 10:
                      notes.append(f"App has only {len(app_one)} rows; minimum 10")
                  if invalid_app:
                      notes.append(f"App OHLCV invalid rows: {invalid_app}")
                  if app_last and days_old(app_last) > 10:
                      notes.append(f"App data stale: {app_last}")
                  if app_one["Date"].duplicated().any():
                      notes.append("App contains duplicate dates")
          
                  y_rows = 0
                  y_last = ""
                  matched = 0
                  mean_diff = ""
                  max_diff = ""
                  invalid_y = 0
                  try:
                      yahoo = download_extended(ticker)
                      y_rows = len(yahoo)
                      y_last = str(yahoo["Date"].iloc[-1])
                      invalid_y = bad_bar_count(yahoo)
                      if y_rows < 200:
                          notes.append(f"Yahoo has only {y_rows} rows; SMA200 needs at least 200")
                      if invalid_y:
                          notes.append(f"Yahoo OHLCV invalid rows: {invalid_y}")
                      if days_old(y_last) > 10:
                          notes.append(f"Yahoo data stale: {y_last}")
                      if len(app_one):
                          overlap = app_one[["Date", "Close"]].merge(
                              yahoo[["Date", "Close"]], on="Date", how="inner", suffixes=("_app", "_yf")
                          )
                          matched = len(overlap)
                          if matched < 10:
                              notes.append(f"Insufficient app vs Yahoo overlap: {matched} days")
                          if matched:
                              differences = ((overlap["Close_app"] - overlap["Close_yf"]).abs()
                                             / overlap["Close_yf"].abs().replace(0, float("nan")) * 100)
                              mean_diff = round(float(differences.mean()), 4)
                              max_diff = round(float(differences.max()), 4)
                              if max_diff > 1.0:
                                  notes.append("Close price differs >1% on some dates; check adjustments/source")
                      extended_parts.append(yahoo.tail(60))
                  except Exception as exc:
                      notes.append(f"Extended history download failed: {type(exc).__name__}: {exc}")
          
                  critical = (db_error or len(app_one) < 10 or invalid_app > 0
                              or (app_last and days_old(app_last) > 10)
                              or y_rows < 200 or invalid_y > 0
                              or (y_last and days_old(y_last) > 10)
                              or matched < 10)
                  if critical:
                      failed = True
                  result = "FAIL" if critical else ("REVIEW" if max_diff != "" and max_diff > 1.0 else "PASS")
                  report.append(dict(Ticker=ticker, AppRows=len(app_one), AppLastDate=app_last,
                                     AppSource=app_source, YahooRows=y_rows, YahooLastDate=y_last,
                                     ComparedRows=matched, MeanCloseDifferencePct=mean_diff,
                                     MaxCloseDifferencePct=max_diff, InvalidAppBars=invalid_app,
                                     InvalidYahooBars=invalid_y, Result=result, Notes="; ".join(notes)))
                  print(f"{ticker}: {result} | app={len(app_one)} rows | extended={y_rows} rows | "
                        f"overlap={matched} | latest={y_last} | {report[-1]['Notes']}")
          
              write_rows(OUTPUT / "validation_summary.csv", SUMMARY_COLS, report)
              combined = pd.concat(extended_parts, ignore_index=True) if extended_parts else pd.DataFrame(columns=EXT_COLS)
              combined.to_csv(OUTPUT / "extended_ohlcv_indicators.csv", columns=list(EXT_COLS), index=False,
                              float_format="%.6f")
              guidance = [
                  "# US Stock Data Validation — Phase 2",
                  "",
                  "GitHub-hosted run, no broker accounts or API keys.",
                  "",
                  "Files: app_ohlcv.csv = application's stored bars (normally around 30 calendar days).",
                  "extended_ohlcv_indicators.csv = last 60 trading sessions, using 2 years of Yahoo Finance",
                  "  adjusted OHLC data to warm up EMA9/21, SMA50/200 and volume indicators.",
                  "validation_summary.csv = missing/stale/invalid bars and app/Yahoo overlapping closes.",
                  "",
                  "IMPORTANT: Yahoo is not an independent cross-check if the app itself used Yahoo/yfinance.",
                  "Adjusted OHLC may differ from unadjusted broker or chart prices, especially around dividends.",
                  "20-day high breakout is a mechanical screening feature, NOT a VCP/PVP/PPP buy signal.",
                  "PASS means basic structural checks passed, NOT that a trading strategy is validated.",
                  "",
                  "## Results",
              ]
              guidance += [f"- {r['Ticker']}: {r['Result']} (app={r['AppRows']}, history={r['YahooRows']}, "
                           f"overlap={r['ComparedRows']}, max close delta={r['MaxCloseDifferencePct']}%) "
                           f"{r['Notes']}" for r in report]
              (OUTPUT / "report.md").write_text("\n".join(guidance) + "\n", encoding="utf-8")
              summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as handle:
                      handle.write("\n".join(guidance) + "\n")
              return 1 if failed else 0
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PYVALIDATION

      - name: Upload reports (even if validation fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-data-validation-reports
          path: validation-results/
          if-no-files-found: warn
          retention-days: 7
